{% extends 'base.html' %}{% from 'components/_macros.html' import field %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="card-n" style="max-width:560px"><form method="post" novalidate>{{ form.hidden_tag() }}
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" value="{{ current_user.email }}" disabled></div>
{% if current_user.registration_number %}<div class="mb-3"><label class="form-label">Registration number</label><input class="form-control" value="{{ current_user.registration_number }}" disabled></div>{% endif %}
{{ field(form.full_name) }}{{ field(form.department) }}<button class="btn btn-primary" type="submit">Save profile</button></form></div>
{% endblock %}
