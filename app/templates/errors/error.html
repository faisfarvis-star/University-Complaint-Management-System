{% extends 'base.html' if current_user.is_authenticated else 'auth/base_auth.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="empty-state" style="padding:1rem 0"><div class="display-4 fw-bold" style="color:var(--primary-strong)">{{ code }}</div>
<strong class="fs-5">{{ title }}</strong><p>{{ text }}</p>
<a class="btn btn-primary mt-2" href="{{ url_for('main.index') }}">Back to home</a></div>
{% endblock %}
